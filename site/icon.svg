    <ellipse cx="70" cy="-70" rx="66" ry="42" fill="#eaf6ef" opacity="0.92" transform="rotate(28 70 -70)"/>
    <!-- body -->
    <ellipse cx="0" cy="20" rx="96" ry="112" fill="#f2c24b"/>
    <!-- stripes -->
    <path d="M-88 -14 A96 112 0 0 1 88 -14 L60 -14 A70 84 0 0 0 -60 -14 Z" fill="#20261d"/>
    <rect x="-92" y="24" width="184" height="30" rx="15" fill="#20261d"/>
    <rect x="-70" y="72" width="140" height="28" rx="14" fill="#20261d"/>
    <!-- eyes -->
    <circle cx="-30" cy="-44" r="12" fill="#20261d"/>
    <circle cx="30" cy="-44" r="12" fill="#20261d"/>
  </g>
</svg>
